name: Build Kairos Online

# Kairos Online lives in its own repo (Arif1221/kairos-online). The offline app is Arif1221/kairos.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the signing key
        # Same key as offline Kairos (secrets set on the repo). Without it, builds use the debug key.
        env:
          KEYSTORE_B64: ${{ secrets.KAIROS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kairos.jks"
            echo "KAIROS_KEYSTORE=$RUNNER_TEMP/kairos.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets; building with the debug key."
          fi
      - name: Build the online APK and run unit tests
        env:
          KAIROS_KEYSTORE_PASSWORD: ${{ secrets.KAIROS_KEYSTORE_PASSWORD }}
          KAIROS_KEY_ALIAS: ${{ secrets.KAIROS_KEY_ALIAS }}
          KAIROS_KEY_PASSWORD: ${{ secrets.KAIROS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleOnlineRelease testOnlineDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-online-apk
          path: app/build/outputs/apk/online/release/*.apk
      # A push to main whose versionName has no release yet publishes v<version>-online,
      # only when signed with the real key.
      - name: Publish Kairos Online release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KAIROS_KEYSTORE_BASE64 != '' }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::Not publishing: add the signing key secrets first."; exit 0; fi
          if gh release view "v$V-online" >/dev/null 2>&1; then echo "v$V-online already released"; exit 0; fi
          mv app/build/outputs/apk/online/release/*.apk "Kairos-Online-$V.apk"
          gh release create "v$V-online" "Kairos-Online-$V.apk" --target "$GITHUB_SHA" \
            --title "Kairos Online $V" --generate-notes \
            --notes "Kairos Online: offline Kairos plus YouTube Music and YouTube (audio only). Installs next to offline Kairos. Coming from 0.7.5.2-online or older? Uninstall it once first (signing key changed). What's new: see CHANGELOG.md."
